<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150" role="img" aria-label="CogniKids">
  <title>CogniKids</title>
  <!--
    Logo CogniKids — versao acessivel.

    Mantem o unicornio e o infinito do logo original. As matizes sao as
    mesmas (ciano, magenta-violeta, ambar), dessaturadas ate passarem em
    WCAG AA: o neon saturado do original e gatilho de sobrecarga sensorial,
    justamente o que o produto existe para evitar.

    O gradiente percorre as tres cores funcionais do sistema:
      ciano   -> professor
      violeta -> aluno (marca principal)
      ambar   -> responsavel

    O infinito e o simbolo internacional da neurodiversidade.
  -->
  <defs>
    <linearGradient id="ck-infinito" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1D6E77"/>
      <stop offset="55%"  stop-color="#5B4B9E"/>
      <stop offset="100%" stop-color="#9A5B12"/>
    </linearGradient>
  </defs>

  <!-- infinito -->
  <path d="M92 64 C 68 42, 34 46, 30 70 C 26 94, 56 106, 78 90 C 100 74, 122 50, 150 48"
        fill="none" stroke="url(#ck-infinito)" stroke-width="9" stroke-linecap="round"/>
  <path d="M150 48 C 178 46, 208 58, 216 78 C 224 98, 202 110, 182 98 C 162 86, 122 62, 92 64"
        fill="none" stroke="url(#ck-infinito)" stroke-width="9" stroke-linecap="round"/>

  <!-- unicornio -->
  <g transform="translate(150,24) scale(0.84)">
    <path d="M40 6 L47 -18 L54 8 Z" fill="#5B4B9E"/>
    <path d="M16 34
             C 16 16, 30 4, 46 6
             C 62 8, 72 20, 72 34
             C 72 42, 68 48, 66 54
             C 64 60, 66 66, 62 72
             C 58 78, 50 76, 46 70
             C 40 62, 34 60, 26 54
             C 19 49, 16 42, 16 34 Z" fill="#5B4B9E"/>
    <path d="M20 20 C 24 8, 38 2, 50 6 C 40 6, 26 12, 20 20 Z" fill="#9B3268"/>
    <path d="M14 30 C 6 26, 2 34, 8 40 C 10 34, 12 32, 14 30 Z" fill="#9B3268"/>
    <circle cx="54" cy="32" r="3.6" fill="#FBFAF8"/>
    <path d="M66 56 C 70 58, 72 62, 69 65" stroke="#FBFAF8" stroke-width="2.2"
          fill="none" stroke-linecap="round"/>
  </g>

  <text x="150" y="140" text-anchor="middle"
        font-family="Iowan Old Style, Palatino Linotype, Georgia, serif"
        font-size="28" font-weight="600" fill="#1C1B1F">CogniKids</text>
</svg>
